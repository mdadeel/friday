[workspace]
resolver = "2"
members = [
    "crates/edith-core",
    "crates/edith-events",
    "crates/edith-storage",
    "crates/edith-models",
    "crates/edith-agent",
    "crates/edith-router",
    "crates/edith-tools",
    "crates/edith-mcp",
    "crates/edith-api",
    "apps/daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["EDITH Engineering Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
edith-core = { path = "crates/edith-core" }
edith-events = { path = "crates/edith-events" }
edith-storage = { path = "crates/edith-storage" }
edith-models = { path = "crates/edith-models" }
edith-agent = { path = "crates/edith-agent" }
edith-router = { path = "crates/edith-router" }
edith-tools = { path = "crates/edith-tools" }
edith-mcp = { path = "crates/edith-mcp" }
edith-api = { path = "crates/edith-api" }

async-trait = { version = "0.1" }

tokio = { version = "1.42", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
toml = { version = "0.8" }
thiserror = { version = "2.0" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "v7", "serde"] }
rusqlite = { version = "0.33", features = ["bundled"] }
r2d2 = { version = "0.8" }
r2d2_sqlite = { version = "0.26" }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tower = { version = "0.5" }
futures-util = { version = "0.3" }
tempfile = { version = "3.14" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
tokio-util = { version = "0.7" }
regex = { version = "1.11" }
